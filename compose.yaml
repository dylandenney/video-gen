services:
  api:
    build: .
    # Host networking so the app reaches ComfyUI (127.0.0.1:8188) and Ollama (127.0.0.1:11434).
    network_mode: host
    # Defaults below; override any of them in an optional .env file. No secrets are needed.
    environment:
      HOST: ${HOST:-0.0.0.0}              # LAN access, no login; do not port-forward. 127.0.0.1 = this machine only
      PORT: ${PORT:-8090}
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:27b}
      COMFY_URL: ${COMFY_URL:-http://127.0.0.1:8188}
      WHISPER_MODEL: ${WHISPER_MODEL-large-v3-turbo}  # ~1.6 GB, downloaded to data/models on first use; set empty to turn off
      OUTPUT_WIDTH: ${OUTPUT_WIDTH:-1080}
      OUTPUT_HEIGHT: ${OUTPUT_HEIGHT:-1920}
      OUTPUT_FPS: ${OUTPUT_FPS:-30}
      # LTX-2.5 on Azure Foundry. The key is a secret: put it in .env (gitignored), never in this file.
      # Without a key the app falls back to Entra ID (needs az login or AZURE_* service-principal vars).
      AZURE_FOUNDRY_RESOURCE_NAME: ${AZURE_FOUNDRY_RESOURCE_NAME:-}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY:-}
      LTX_DEPLOYMENT: ${LTX_DEPLOYMENT:-Fal-LTX-2.5-Fast}
      LTX_RESOLUTION: ${LTX_RESOLUTION:-1080p}
      LTX_TIMEOUT: ${LTX_TIMEOUT:-900}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/data
    restart: unless-stopped
